<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="空調管理">
<link rel="apple-touch-icon" href="icon-192.png">
<title>空調工程管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--card:#fff;--border:rgba(60,60,67,.13);
  --blue:#007AFF;--blue-d:#0062CC;--blue-l:rgba(0,122,255,.12);
  --green:#34C759;--green-d:#248A3D;--green-l:rgba(52,199,89,.13);
  --red:#FF3B30;--red-l:rgba(255,59,48,.12);
  --orange:#FF9500;--orange-l:rgba(255,149,0,.13);
  --purple:#AF52DE;--purple-l:rgba(175,82,222,.12);
  --gray:#8E8E93;--gray2:#AEAEB2;--gray3:#C7C7CC;
  --text1:#1C1C1E;--text2:#3A3A3C;--text3:#636366;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Noto Sans TC',sans-serif;color:var(--text1);font-size:15px;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.navbar{background:rgba(242,242,247,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(var(--safe-top) + 4px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border);flex-shrink:0;z-index:50}
.navbar-title{font-size:17px;font-weight:700}
.navbar-sub{font-size:11px;color:var(--gray);margin-top:1px}
.nav-actions{display:flex;gap:8px}
.nav-btn{background:var(--blue-l);color:var(--blue);border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.monthbar{background:var(--card);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:16px;padding:9px 16px;flex-shrink:0}
.month-arrow{width:28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue);border:none;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.month-label{font-size:16px;font-weight:700;min-width:96px;text-align:center}
.tabbar{background:rgba(242,242,247,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 4px;cursor:pointer;border:none;background:none;color:var(--gray2);font-family:inherit}
.tab-item.active{color:var(--blue)}
.tab-icon{font-size:22px;line-height:1;margin-bottom:2px}
.tab-label{font-size:10px;font-weight:500}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:14px 14px 24px}
.page.active{display:block}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:4px}
.sec-title{font-size:13px;font-weight:700;color:var(--text2)}
.add-btn{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.metric-label{font-size:11px;color:var(--gray);margin-bottom:4px}
.metric-value{font-size:21px;font-weight:700}
.metric-value.blue{color:var(--blue)}.metric-value.green{color:var(--green-d)}.metric-value.red{color:var(--red)}.metric-value.orange{color:var(--orange)}
.list-item{padding:12px 14px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--bg)}
.item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.icon-blue{background:var(--blue-l)}.icon-green{background:var(--green-l)}.icon-orange{background:var(--orange-l)}.icon-red{background:var(--red-l)}.icon-purple{background:var(--purple-l)}
.item-body{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:500;color:var(--text1)}
.item-sub{font-size:12px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.item-amount{font-size:15px;font-weight:600}
.item-amount.green{color:var(--green-d)}.item-amount.red{color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-l);color:var(--green-d)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-orange{background:var(--orange-l);color:#B96200}
.badge-blue{background:var(--blue-l);color:var(--blue)}
.badge-gray{background:rgba(142,142,147,.15);color:var(--gray)}
.finance-block{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.f-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:.5px solid var(--border);font-size:14px}
.f-row:last-child{border-bottom:none}
.f-row.total{font-weight:700;font-size:15px}
.f-label{color:var(--text3)}
.payout-row{display:flex;padding:10px 14px;border-bottom:.5px solid var(--border);align-items:center}
.payout-row:last-child{border-bottom:none}
.payout-row.hr{background:var(--bg)}
.pc{flex:1;font-size:12px}
.pc.h{font-weight:600;color:var(--gray);font-size:11px}
.pc.name{font-weight:600;font-size:14px;flex:1.3}
.pc.r{text-align:right;font-size:13px}
.pc.r.green{color:var(--green-d);font-weight:600}.pc.r.red{color:var(--red);font-weight:600}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom)+8px)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--gray3);margin:10px auto 0}
.sheet-header{padding:14px 18px 12px;border-bottom:.5px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sheet-title{font-size:17px;font-weight:700}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;font-size:16px;color:var(--gray);cursor:pointer}
.sheet-body{padding:16px 18px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fl{font-size:13px;font-weight:500;color:var(--text2)}
.fi{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:15px;color:var(--text1);font-family:inherit;outline:none;-webkit-appearance:none}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
textarea.fi{min-height:76px;resize:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days-selector{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:4px}
.dsb{padding:13px 4px;border-radius:12px;border:2px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;color:var(--text3);cursor:pointer;text-align:center;font-family:inherit;transition:all .15s}
.dsb.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.toggle-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.toggle-label{font-size:15px;color:var(--text1)}
.tog{position:relative;width:51px;height:31px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-track{position:absolute;inset:0;border-radius:31px;background:var(--gray3);cursor:pointer;transition:background .2s}
.tog input:checked+.tog-track{background:var(--green)}
.tog-thumb{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s;pointer-events:none}
.tog input:checked~.tog-thumb{transform:translateX(20px)}
.submit-btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:6px}
.submit-btn:active{background:var(--blue-d)}
.calc-preview{background:var(--green-l);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.calc-amount{font-size:26px;font-weight:700;color:var(--green-d)}
.calc-detail{font-size:12px;color:var(--green-d);margin-top:2px;opacity:.8}
.action-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:flex-end}
.action-overlay.open{display:flex}
.action-sheet{width:100%;padding:0 10px calc(var(--safe-bottom)+10px)}
.action-group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}
.action-btn{padding:16px;font-size:17px;color:var(--blue);border:none;border-bottom:.5px solid var(--border);width:100%;background:none;font-family:inherit;cursor:pointer;text-align:center}
.action-btn:last-child{border-bottom:none}
.action-btn.danger{color:var(--red)}
.action-cancel{background:var(--card);border-radius:14px;padding:16px;font-size:17px;font-weight:600;color:var(--blue);text-align:center;cursor:pointer;border:none;width:100%;font-family:inherit}
.empty{text-align:center;padding:36px 20px;color:var(--gray2)}
.empty-icon{font-size:44px;margin-bottom:8px;opacity:.5}
.empty-text{font-size:14px}
.toast{position:fixed;bottom:calc(var(--safe-bottom)+72px);left:50%;transform:translateX(-50%) translateY(10px);background:rgba(40,40,40,.92);color:#fff;border-radius:20px;padding:10px 20px;font-size:14px;font-weight:500;z-index:500;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:calc(var(--safe-bottom)+10px)}
.day-chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;display:inline-block;margin:3px}
.chip-full{background:var(--green-l);color:var(--green-d)}
.chip-half{background:var(--orange-l);color:#B96200}
.chip-ot{background:var(--blue-l);color:var(--blue)}
.chip-absent{background:var(--red-l);color:var(--red)}
/* Search bar */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.search-bar input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:var(--text1)}
.search-bar input::placeholder{color:var(--gray2)}
.search-result{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden;display:none}
.search-result-header{padding:10px 14px;background:var(--blue-l);display:flex;align-items:center;justify-content:space-between}
.search-result-title{font-size:13px;font-weight:700;color:var(--blue)}
.sr-close{border:none;background:none;color:var(--blue);font-size:18px;cursor:pointer;padding:0 4px}
/* Vendor category */
.cat-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cat-btn-item{padding:9px 18px;border-radius:22px;border:2px solid var(--border);background:var(--bg);font-size:14px;font-weight:600;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent}
.cat-btn-item.sel{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.3)}
</style>
</head>
<body>
<div class="app">

<div class="navbar">
  <div>
    <div class="navbar-title">🌀 空調工程管理</div>
    <div class="navbar-sub" id="navbar-sub"></div>
  </div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="loadAllData(true)" style="background:var(--green-l);color:var(--green-d)">🔄</button>
    <button class="nav-btn" onclick="exportExcel()">📊 匯出</button>
    <button class="nav-btn" onclick="exportYear()">📅 年報</button>
  </div>
</div>

<div class="monthbar">
  <button class="month-arrow" onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="monthLabel"></div>
  <button class="month-arrow" onclick="changeMonth(1)">›</button>
</div>

<div class="content">

  <!-- 員工薪資 -->
  <div class="page active" id="page-emp">
    <div class="summary-grid" id="emp-summary"></div>
    <div class="sec-header">
      <div class="sec-title">員工名冊</div>
      <button class="add-btn" onclick="openNewStaff()">＋ 新增員工</button>
    </div>
    <div class="card" id="staff-list"></div>
    <div class="sec-header"><div class="sec-title">當月薪資總覽</div></div>
    <div class="card" id="payout-table"></div>
    <div class="sec-header">
      <div class="sec-title">工作日誌</div>
      <button class="add-btn" onclick="openSheet('journal')">＋ 新增</button>
    </div>
    <div class="card" id="journal-list"></div>
  </div>

  <!-- 叫貨施工 -->
  <div class="page" id="page-orders">
    <!-- 廠商搜尋 -->
    <div class="search-bar">
      <span style="font-size:16px">🔍</span>
      <input type="text" id="vendor-search" placeholder="搜尋支出內容或備註..." onkeydown="if(event.key==='Enter')searchVendor()">
      <button class="add-btn" style="font-size:12px;padding:4px 10px" onclick="searchVendor()">查詢</button>
    </div>
    <div class="search-result" id="vendor-search-result">
      <div class="search-result-header">
        <span class="search-result-title" id="vendor-search-title"></span>
        <button class="sr-close" onclick="clearSearch('vendor')">✕</button>
      </div>
      <div id="vendor-search-body"></div>
    </div>
    <div class="sec-header">
      <div class="sec-title">支出項目</div>
      <button class="add-btn" onclick="openSheet('vendor')">＋ 新增</button>
    </div>
    <div class="card" id="vendor-list"></div>
    <!-- 業主搜尋 -->
    <div class="search-bar" style="margin-top:8px">
      <span style="font-size:16px">🔍</span>
      <input type="text" id="owner-search" placeholder="輸入業主名稱查詢歷史..." onkeydown="if(event.key==='Enter')searchOwner()">
      <button class="add-btn" style="font-size:12px;padding:4px 10px" onclick="searchOwner()">查詢</button>
    </div>
    <div class="search-result" id="owner-search-result">
      <div class="search-result-header">
        <span class="search-result-title" id="owner-search-title"></span>
        <button class="sr-close" onclick="clearSearch('owner')">✕</button>
      </div>
      <div id="owner-search-body"></div>
    </div>
    <div class="sec-header">
      <div class="sec-title">業主施工收費</div>
      <button class="add-btn" onclick="openSheet('owner')">＋ 新增</button>
    </div>
    <div class="card" id="owner-list"></div>
  </div>

  <!-- 發票利潤 -->
  <div class="page" id="page-finance">
    <div class="summary-grid" id="fin-summary"></div>
    <div class="sec-header">
      <div class="sec-title">進項發票（廠商給我）</div>
      <button class="add-btn" onclick="openSheet('purchInv')">＋ 新增</button>
    </div>
    <div class="card" id="purch-inv-list"></div>
    <div class="sec-header">
      <div class="sec-title">銷項發票（開給業主）</div>
      <button class="add-btn" onclick="openSheet('salesInv')">＋ 新增</button>
    </div>
    <div class="card" id="sales-inv-list"></div>
    <div class="sec-header"><div class="sec-title">發票差額</div></div>
    <div class="finance-block" id="inv-breakdown"></div>
    <div class="sec-header"><div class="sec-title">💹 當月淨利潤</div></div>
    <div class="finance-block" id="profit-block"></div>
    <div class="sec-header">
      <div class="sec-title">📧 寄送年報至 Email</div>
      <button class="add-btn" onclick="openEmailSheet()">設定</button>
    </div>
    <div class="card" id="email-status-block" style="padding:12px 14px">
      <div style="font-size:13px;color:var(--gray)">尚未設定收件 Email，點右上角「設定」</div>
    </div>
  </div>

</div>

<div class="tabbar">
  <button class="tab-item active" onclick="switchTab('emp',0)">
    <div class="tab-icon">👷</div><div class="tab-label">員工薪資</div>
  </button>
  <button class="tab-item" onclick="switchTab('orders',1)">
    <div class="tab-icon">🚚</div><div class="tab-label">叫貨施工</div>
  </button>
  <button class="tab-item" onclick="switchTab('finance',2)">
    <div class="tab-icon">🧾</div><div class="tab-label">發票利潤</div>
  </button>
</div>
</div>

<!-- 出勤 Sheet -->
<div class="overlay" id="attendSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="attendSheet-title">記錄出勤</div>
      <button class="sheet-close" onclick="closeSheet('attendSheet')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="frow">
        <div class="fg"><label class="fl">日期</label><input type="date" class="fi" id="a-date"></div>
        <div class="fg"><label class="fl">出勤狀態</label>
          <select class="fi" id="a-attend" onchange="calcAttend()">
            <option value="出勤">出勤</option>
            <option value="加班">加班</option>
            <option value="缺席">缺席</option>
            <option value="請假">請假</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label class="fl">工作天數</label>
        <div class="days-selector">
          <button class="dsb" data-val="0.5" onclick="selectDays(this)">0.5天</button>
          <button class="dsb sel" data-val="1" onclick="selectDays(this)">1天</button>
          <button class="dsb" data-val="1.5" onclick="selectDays(this)">1.5天</button>
          <button class="dsb" data-val="2" onclick="selectDays(this)">2天</button>
        </div>
      </div>
      <div class="calc-preview" id="a-preview">
        <div class="calc-detail" id="a-detail"></div>
        <div class="calc-amount" id="a-amount">$0</div>
      </div>
      <div class="fg"><label class="fl">預支薪水（元）</label>
        <input type="number" class="fi" id="a-advance" placeholder="0" inputmode="numeric">
      </div>
      <div class="fg"><label class="fl">備註</label>
        <input type="text" class="fi" id="a-remark" placeholder="備註...">
      </div>
      <div class="toggle-item">
        <span class="toggle-label">已匯款給員工</span>
        <label class="tog"><input type="checkbox" id="a-paid"><div class="tog-track"></div><div class="tog-thumb"></div></label>
      </div>
      <button class="submit-btn" onclick="saveAttend()">儲存出勤</button>
    </div>
  </div>
</div>

<!-- 員工 Sheet -->
<div class="overlay" id="staffSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="staffSheet-title">新增員工</div>
      <button class="sheet-close" onclick="closeSheet('staffSheet')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="fg"><label class="fl">員工姓名</label><input type="text" class="fi" id="s-name" placeholder="姓名"></div>
      <div class="frow">
        <div class="fg"><label class="fl">日薪（元/天）</label><input type="number" class="fi" id="s-daily" placeholder="0" inputmode="numeric"></div>
        <div class="fg"><label class="fl">職稱/備註</label><input type="text" class="fi" id="s-remark" placeholder="師傅、學徒..."></div>
      </div>
      <button class="submit-btn" onclick="saveStaff()">儲存員工</button>
    </div>
  </div>
</div>

<!-- 工作日誌 Sheet（移除施工地點） -->
<div class="overlay" id="journalSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxeAOlk1R8OeBFJDRlNRTQp5NVj1ON2uV2fDrx2TU9aAK7X8sEo7a_VBDg3ApImucNQ/exec';
let currentMonth='',editingId=null,editingType=null;
let actionId=null,actionType=null;
let curStaffId=null,selectedDays=1;
let cache={staff:null,months:{}};
// 貨品大項（預設＋自訂）
let vendorCats=JSON.parse(localStorage.getItem('vendorCats')||'["雜項","設備","材料"]');
let selectedCat='';

// ── Sync ──
function setSyncStatus(state,msg){
  let el=document.getElementById('sync-indicator');if(!el)return;
  if(state==='syncing'){el.textContent='⏳ 同步中...';el.style.color='var(--gray)'}
  else if(state==='ok'){el.textContent='☁️ 已同步';el.style.color='var(--green-d)'}
  else{el.textContent='⚠️ '+(msg||'同步失敗');el.style.color='var(--red)'}
}

async function apiGet(type,month){
  let url=API_URL+'?type='+type+'&cb='+Date.now()+'&r='+Math.random().toString(36).slice(2);
  if(month)url+='&month='+month;
  const res=await fetch(url,{method:'GET',redirect:'follow',mode:'cors',credentials:'omit',cache:'no-store'});
  const json=JSON.parse(await res.text());
  if(!json.success)throw new Error(json.error||'read error');
  return json.data||[];
}
async function apiSave(type,record){
  const params=encodeURIComponent(JSON.stringify({type,action:'save',record}));
  const res=await fetch(API_URL+'?payload='+params+'&cb='+Date.now(),{method:'GET',redirect:'follow',mode:'cors',credentials:'omit'});
  const json=JSON.parse(await res.text());
  if(!json.success)throw new Error(json.error||'save error');
  return json;
}
async function apiDelete(type,id){
  const params=encodeURIComponent(JSON.stringify({type,action:'delete',id}));
  const res=await fetch(API_URL+'?payload='+params+'&cb='+Date.now(),{method:'GET',redirect:'follow',mode:'cors',credentials:'omit'});
  const json=JSON.parse(await res.text());
  if(!json.success)throw new Error(json.error||'delete error');
}

async function loadAllData(forceRefresh=false){
  setSyncStatus('syncing');
  try{
    const[staff,employees,vendors,owners,purchInvs,salesInvs,journals]=await Promise.all([
      (cache.staff&&!forceRefresh)?Promise.resolve(cache.staff):apiGet('staff'),
      apiGet('employees',currentMonth),
      apiGet('vendors',currentMonth),
      apiGet('owners',currentMonth),
      apiGet('purchInvs',currentMonth),
      apiGet('salesInvs',currentMonth),
      apiGet('journals',currentMonth)
    ]);
    cache.staff=staff;
    cache.months[currentMonth]={employees,vendors,owners,purchInvs,salesInvs,journals};
    setSyncStatus('ok');renderAll();
    if(forceRefresh)toast('✅ 資料已更新！');
  }catch(e){
    setSyncStatus('error',e.message);renderAll();toast('⚠️ 讀取失敗，顯示本機資料');
  }
}

function getStaff(){return cache.staff||[]}
function setStaff(a){cache.staff=a}
function getM(t){
  if(!cache.months[currentMonth])cache.months[currentMonth]={employees:[],vendors:[],owners:[],purchInvs:[],salesInvs:[],journals:[]};
  return cache.months[currentMonth][t]||[];
}
function setM(t,a){
  if(!cache.months[currentMonth])cache.months[currentMonth]={employees:[],vendors:[],owners:[],purchInvs:[],salesInvs:[],journals:[]};
  cache.months[currentMonth][t]=a;
}

async function doSave(type,rec){
  setSyncStatus('syncing');
  if(type==='staff'){let a=getStaff();const i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);setStaff(a)}
  else{let a=getM(type);const i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);setM(type,a)}
  renderAll();
  try{await apiSave(type,rec);setSyncStatus('ok')}
  catch(e){setSyncStatus('error',e.message);toast('⚠️ 雲端儲存失敗，請稍後重試')}
}
async function cloudDelete(type,id){
  if(type==='staff')setStaff(getStaff().filter(x=>x.id!==id));
  else setM(type,getM(type).filter(x=>x.id!==id));
  renderAll();
  try{await apiDelete(type,id);setSyncStatus('ok')}
  catch(e){setSyncStatus('error',e.message);toast('⚠️ 雲端刪除失敗')}
}

function initMonth(){const n=new Date();currentMonth=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');updateMonthLabel()}
function updateMonthLabel(){const[y,m]=currentMonth.split('-');document.getElementById('monthLabel').textContent=y+'年'+parseInt(m)+'月';document.getElementById('navbar-sub').textContent=currentMonth+' 管理記錄'}
function changeMonth(dir){const[y,m]=currentMonth.split('-').map(Number);const d=new Date(y,m-1+dir,1);currentMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');updateMonthLabel();loadAllData()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmt(n){return Number(n||0).toLocaleString('zh-TW')}
function today(){return new Date().toISOString().split('T')[0]}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function switchTab(name,idx){
  document.querySelectorAll('.tab-item').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
}
function openSheet(type){
  editingId=null;editingType=type;
  const map={vendor:'vendorSheet',owner:'ownerSheet',purchInv:'purchInvSheet',salesInv:'salesInvSheet',journal:'journalSheet'};
  const id=map[type]||type+'Sheet';
  clearSheet(id);
  const dm={vendor:'v-date',owner:null,purchInv:'pi-date',salesInv:'si-date',journal:'j-date'};
  if(dm[type]&&dm[type]!==null){const el=document.getElementById(dm[type]);if(el)el.value=today()}
  if(type==='vendor'){selectedCat='';renderCatBtns('');}
  document.getElementById(id).classList.add('open');
  document.querySelector('#'+id+' .sheet').scrollTop=0;
}
function closeSheet(id){document.getElementById(id).classList.remove('open');editingId=null}
function clearSheet(id){document.getElementById(id).querySelectorAll('input,textarea,select').forEach(el=>{if(el.type==='checkbox')el.checked=false;else if(el.tagName==='SELECT')el.selectedIndex=0;else el.value=''})}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openAction(type,id){actionType=type;actionId=id;document.getElementById('actionOverlay').classList.add('open')}
function closeAction(){document.getElementById('actionOverlay').classList.remove('open');actionId=null;actionType=null}
function doDelete(){
  if(!confirm('確定刪除？'))return;
  const t=actionType,id=actionId;closeAction();
  cloudDelete(t,id);toast('已刪除');
}
function doEdit(){
  const t=actionType,id=actionId;closeAction();
  setTimeout(()=>{
    if(t==='staff')editStaff(id);
    else if(t==='employees')editAttend(id);
    else if(t==='vendors')editVendor(id);
    else if(t==='owners')editOwner(id);
    else if(t==='purchInvs')editPurchInv(id);
    else if(t==='salesInvs')editSalesInv(id);
    else if(t==='journals')editJournal(id);
  },200);
}

// ── 支出大項管理 ──
function saveCats(){localStorage.setItem('vendorCats',JSON.stringify(vendorCats))}

function renderCatBtns(selected){
  selectedCat=selected||selectedCat||'';
  const wrap=document.getElementById('v-cat-btns');
  if(!wrap)return;
  wrap.innerHTML=vendorCats.map(c=>`
    <button class="cat-btn-item${selectedCat===c?' sel':''}" onclick="pickCat('${c}',this)">${c}</button>
  `).join('');
}

function pickCat(cat,btn){
  selectedCat=cat;
  document.querySelectorAll('#v-cat-btns .cat-btn-item').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

function refreshCatSelect(selected){renderCatBtns(selected);}

function openCatManager(){
  renderCatManagerList();
  document.getElementById('catManagerSheet').classList.add('open');
}

function renderCatManagerList(){
  const list=document.getElementById('cat-manager-list');
  if(!list)return;
  list.innerHTML=vendorCats.length?vendorCats.map((c,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid var(--border)">
      <input type="text" value="${c}" id="cat-edit-${i}" class="fi" style="flex:1;padding:8px 10px;font-size:14px">
      <button onclick="saveCatEdit(${i})" style="background:var(--blue);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap">儲存</button>
      <button onclick="deleteCat(${i})" style="background:var(--red-l);color:var(--red);border:none;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;font-family:inherit">刪除</button>
    </div>`).join(''):'<div style="color:var(--gray2);font-size:13px;padding:10px 0">尚無大項，請新增</div>';
}

function saveCatEdit(i){
  const val=document.getElementById('cat-edit-'+i).value.trim();
  if(!val){alert('名稱不能空白');return}
  vendorCats[i]=val;saveCats();
  renderCatManagerList();selectedCat=val;renderCatBtns(val);
  toast('✅ 已更新：'+val);
}

function deleteCat(i){
  if(!confirm('確定刪除「'+vendorCats[i]+'」？'))return;
  vendorCats.splice(i,1);saveCats();
  renderCatManagerList();refreshCatSelect('');
  toast('已刪除');
}

function addCatFromManager(){
  const inp=document.getElementById('new-cat-input');
  const val=inp.value.trim();
  if(!val){alert('請輸入大項名稱');return}
  if(vendorCats.includes(val)){alert('已有此大項');return}
  vendorCats.push(val);saveCats();
  inp.value='';
  renderCatManagerList();
  selectedCat=val;renderCatBtns(val);
  toast('✅ 已新增：'+val);
}

// ── 員工 ──
function openNewStaff(){editingId=null;document.getElementById('staffSheet-title').textContent='新增員工';clearSheet('staffSheet');document.getElementById('staffSheet').classList.add('open')}
function saveStaff(){
  const name=document.getElementById('s-name').value.trim();
  const daily=Number(document.getElementById('s-daily').value)||0;
  if(!name||!daily){alert('請填寫姓名和日薪');return}
  const rec={id:editingId||uid(),name,daily,remark:document.getElementById('s-remark').value.trim()};
  doSave('staff',rec);closeSheet('staffSheet');toast('✅ 員工已儲存');
}
function editStaff(id){
  const rec=getStaff().find(x=>x.id===id);if(!rec)return;
  editingId=id;
  document.getElementById('staffSheet-title').textContent='編輯員工';
  document.getElementById('s-name').value=rec.name;
  document.getElementById('s-daily').value=rec.daily;
  document.getElementById('s-remark').value=rec.remark||'';
  document.getElementById('staffSheet').classList.add('open');
}

// ── 出勤 ──
function openAttendForStaff(staffId){
  curStaffId=staffId;editingId=null;
  const staff=getStaff().find(s=>s.id===staffId);if(!staff)return;
  document.getElementById('attendSheet-title').textContent=staff.name+' — 記錄出勤';
  clearSheet('attendSheet');selectedDays=1;
  document.querySelectorAll('.dsb').forEach(b=>b.classList.toggle('sel',b.dataset.val==='1'));
  document.getElementById('a-date').value=today();
  document.getElementById('a-attend').selectedIndex=0;
  calcAttend();
  document.getElementById('attendSheet').classList.add('open');
  document.querySelector('#attendSheet .sheet').scrollTop=0;
}
function selectDays(btn){document.querySelectorAll('.dsb').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');selectedDays=parseFloat(btn.dataset.val);calcAttend()}
function calcAttend(){
  const staff=getStaff().find(s=>s.id===curStaffId);
  const attend=document.getElementById('a-attend')?document.getElementById('a-attend').value:'出勤';
  const preview=document.getElementById('a-preview'),amtEl=document.getElementById('a-amount'),detEl=document.getElementById('a-detail');
  if(!staff||!['出勤','加班'].includes(attend)){preview.style.background='rgba(142,142,147,.1)';amtEl.textContent='$0';detEl.textContent='未出勤';return}
  preview.style.background='';
  let earning=staff.daily*selectedDays,detail='日薪 $'+fmt(staff.daily)+' × '+selectedDays+'天';
  if(attend==='加班'){earning=Math.round(earning*1.5);detail+=' (加班×1.5)'}
  amtEl.textContent='$'+fmt(earning);detEl.textContent=detail;
}
function saveAttend(){
  const staff=getStaff().find(s=>s.id===curStaffId);if(!staff){alert('找不到員工');return}
  const date=document.getElementById('a-date').value,attend=document.getElementById('a-attend').value;
  if(!date){alert('請填寫日期');return}
  const isWork=['出勤','加班'].includes(attend);
  let earning=0,earningDetail='';
  if(isWork){earning=staff.daily*selectedDays;earningDetail='日薪$'+fmt(staff.daily)+'×'+selectedDays+'天';if(attend==='加班'){earning=Math.round(earning*1.5);earningDetail+='×1.5'}}
  const rec={id:editingId||uid(),month:currentMonth,staffId:staff.id,name:staff.name,date,attend,days:selectedDays,earning,earningDetail,advance:Number(document.getElementById('a-advance').value)||0,remark:document.getElementById('a-remark').value.trim(),paid:document.getElementById('a-paid').checked};
  doSave('employees',rec);closeSheet('attendSheet');toast('✅ 出勤已記錄');
}
function editAttend(id){
  const rec=getM('employees').find(x=>x.id===id);if(!rec)return;
  curStaffId=rec.staffId;editingId=id;
  const staff=getStaff().find(s=>s.id===rec.staffId);
  document.getElementById('attendSheet-title').textContent=(staff?staff.name:'員工')+' — 編輯出勤';
  document.getElementById('a-date').value=rec.date;
  document.getElementById('a-attend').value=rec.attend;
  selectedDays=rec.days||1;
  document.querySelectorAll('.dsb').forEach(b=>b.classList.toggle('sel',parseFloat(b.dataset.val)===selectedDays));
  document.getElementById('a-advance').value=rec.advance||'';
  document.getElementById('a-remark').value=rec.remark||'';
  document.getElementById('a-paid').checked=!!rec.paid;
  calcAttend();
  document.getElementById('attendSheet').classList.add('open');
}

// ── 員工詳細 ──
function openStaffDetail(staffId){
  const staff=getStaff().find(s=>s.id===staffId);if(!staff)return;
  const emps=getM('employees').filter(e=>e.staffId===staffId).sort((a,b)=>a.date.localeCompare(b.date));
  const isWork=e=>['出勤','加班'].includes(e.attend);
  const totalEarning=emps.reduce((s,e)=>s+(isWork(e)?Number(e.earning||0):0),0);
  const totalAdv=emps.reduce((s,e)=>s+Number(e.advance||0),0);
  const totalDays=emps.filter(isWork).reduce((s,e)=>s+Number(e.days||0),0);
  document.getElementById('staffDetail-name').textContent=staff.name+' — 當月明細';
  const chips=emps.map(e=>{
    const cls=e.attend==='加班'?'chip-ot':e.attend==='出勤'?(e.days<1?'chip-half':'chip-full'):'chip-absent';
    const label=e.date.slice(5)+(e.days!==1?' ('+e.days+'天)':'');
    return '<span class="day-chip '+cls+'" onclick="closeModal(\'staffDetailModal\');setTimeout(()=>openAction(\'employees\',\''+e.id+'\'),250)">'+label+'</span>';
  }).join('');
  document.getElementById('staffDetail-body').innerHTML=`

// ── 搜尋功能 ──
function searchVendor(){
  const q=document.getElementById('vendor-search').value.trim();
  const resultEl=document.getElementById('vendor-search-result');
  if(!q){resultEl.style.display='none';return}
  let matched=[];
  Object.entries(cache.months).forEach(([m,md])=>{
    (md.vendors||[]).forEach(v=>{
      // 搜尋大項、內容說明、備註
      const haystack=[v.cat,v.desc,v.remark].filter(Boolean).join(' ');
      if(haystack.includes(q))matched.push({...v,_month:m});
    });
  });
  matched.sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('vendor-search-title').textContent='「'+q+'」共 '+matched.length+' 筆支出';
  const total=matched.reduce((s,v)=>s+Number(v.amount||0),0);
  document.getElementById('vendor-search-body').innerHTML=matched.length?
    matched.map(v=>{
      // 把關鍵字標黃
      const hl=txt=>txt?txt.replace(new RegExp(q,'g'),'<mark style="background:#FFE58F;border-radius:3px">'+q+'</mark>'):txt;
      return `<div class="list-item">
        <div class="item-icon icon-orange">💰</div>
        <div class="item-body">
          <div class="item-title">${v.cat?'<span class="badge badge-orange">'+v.cat+'</span> ':''}${hl(v.desc)||'無說明'}</div>
          <div class="item-sub">${v.date}　${v._month}${v.remark?' ・ 備註：'+hl(v.remark):''}</div>
        </div>
        <div class="item-right"><div class="item-amount red">$${fmt(v.amount)}</div></div>
      </div>`;
    }).join('')+`<div style="padding:10px 14px;font-size:13px;font-weight:700;text-align:right;border-top:.5px solid var(--border)">合計 $${fmt(total)}</div>`:
    '<div class="empty"><div class="empty-text">查無相關支出記錄</div></div>';
  resultEl.style.display='block';
}

function searchOwner(){
  const q=document.getElementById('owner-search').value.trim();
  const resultEl=document.getElementById('owner-search-result');
  if(!q){resultEl.style.display='none';return}
  let matched=[];
  Object.entries(cache.months).forEach(([m,md])=>{
    (md.owners||[]).forEach(o=>{if(o.owner&&o.owner.includes(q))matched.push({...o,_month:m})});
  });
  matched.sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('owner-search-title').textContent='「'+q+'」歷史施工 '+matched.length+' 筆';
  const total=matched.reduce((s,o)=>s+Number(o.amount||0),0);
  document.getElementById('owner-search-body').innerHTML=matched.length?
    matched.map(o=>`<div class="list-item">
      <div class="item-icon icon-green">🏢</div>
      <div class="item-body">
        <div class="item-title">${o.desc||'（無說明）'}</div>
        <div class="item-sub">${o.date}　${o._month}</div>

}

function renderEmp(){
  const staffList=getStaff(),emps=getM('employees');
  const isWork=e=>['出勤','加班'].includes(e.attend);
  const totalSalary=emps.reduce((s,e)=>s+(isWork(e)?Number(e.earning||0):0),0);
  const totalAdv=emps.reduce((s,e)=>s+Number(e.advance||0),0);
  const toPay=totalSalary-totalAdv;
  const days=emps.filter(isWork).reduce((s,e)=>s+Number(e.days||0),0);
  document.getElementById('emp-summary').innerHTML=`
    <div class="metric"><div class="metric-label">出勤天數</div><div class="metric-value blue">${days}天</div></div>
    <div class="metric"><div class="metric-label">薪資總額</div><div class="metric-value">$${fmt(totalSalary)}</div></div>
    <div class="metric"><div class="metric-label">預支合計</div><div class="metric-value orange">$${fmt(totalAdv)}</div></div>
    <div class="metric"><div class="metric-label">尚需匯款</div><div class="metric-value ${toPay>=0?'green':'red'}">$${fmt(toPay)}</div></div>`;
  const sl=document.getElementById('staff-list');
  sl.innerHTML=staffList.length?staffList.map(s=>{
    const recs=emps.filter(e=>e.staffId===s.id&&isWork(e));
    const mEarning=recs.reduce((sum,e)=>sum+Number(e.earning||0),0);
    const mDays=recs.reduce((sum,e)=>sum+Number(e.days||0),0);
    return `<div class="list-item" onclick="openStaffDetail('${s.id}')">
      <div class="item-icon icon-blue">👷</div>
      <div class="item-body">
        <div class="item-title">${s.name}${s.remark?' <span style="font-size:12px;color:var(--gray)">'+s.remark+'</span>':''}</div>
        <div class="item-sub">日薪 $${fmt(s.daily)}　本月出勤 ${mDays} 天</div>
      </div>
      <div class="item-right">
        <div class="item-amount green">$${fmt(mEarning)}</div>
        <span class="badge badge-blue">點看明細 ›</span>
      </div>
    </div>`;
  }).join(''):'<div class="empty"><div class="empty-icon">👤</div><div class="empty-text">點右上角新增員工</div></div>';

  const byEmp={};
  emps.forEach(e=>{
    if(!byEmp[e.name])byEmp[e.name]={salary:0,adv:0,paid:false};
    if(isWork(e))byEmp[e.name].salary+=Number(e.earning||0);
    byEmp[e.name].adv+=Number(e.advance||0);
    if(e.paid)byEmp[e.name].paid=true;
  });
  const entries=Object.entries(byEmp);
  document.getElementById('payout-table').innerHTML=entries.length?`
    <div class="payout-row hr"><div class="pc h name">員工</div><div class="pc h r">薪資</div><div class="pc h r">預支</div><div class="pc h r">應付</div></div>`+
    entries.map(([name,v])=>{
      const net=v.salary-v.adv;
      return `<div class="payout-row">
        <div class="pc name">${name}</div>
        <div class="pc r">$${fmt(v.salary)}</div>
        <div class="pc r">$${fmt(v.adv)}</div>
        <div class="pc r ${net>=0?'green':'red'}">$${fmt(net)}</div>
      </div>`;
    }).join(''):'<div class="empty"><div class="empty-text" style="padding:16px">尚無資料</div></div>';

  const journals=getM('journals').slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('journal-list').innerHTML=journals.length?journals.map(j=>`
    <div class="list-item" onclick="openAction('journals','${j.id}')">
      <div class="item-icon icon-green">📋</div>
      <div class="item-body">
        <div class="item-title">${j.date}</div>
        <div class="item-sub">${j.content}</div>
      </div>
    </div>`).join(''):'<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">尚無工作日誌</div></div>';
}

function renderFinance(){
  const purchInvs=getM('purchInvs').slice().sort((a,b)=>b.date.localeCompare(a.date));
  const salesInvs=getM('salesInvs').slice().sort((a,b)=>b.date.localeCompare(a.date));
  const totalPurch=purchInvs.reduce((s,i)=>s+Number(i.amount||0),0);
  const totalSales=salesInvs.reduce((s,i)=>s+Number(i.amount||0),0);
  const diff=totalSales-totalPurch;

  // 從員工頁取薪資總額
  const emps=getM('employees');
  const isWork=e=>['出勤','加班'].includes(e.attend);
  const totalSalary=emps.reduce((s,e)=>s+(isWork(e)?Number(e.earning||0):0),0);
  // 業主收入
  const owners=getM('owners');
  const totalOwner=owners.reduce((s,o)=>s+Number(o.amount||0),0);
  // 淨利潤 = 銷項發票 - 進項發票 - 員工薪資
  const profit=totalSales-totalPurch-totalSalary;

  document.getElementById('fin-summary').innerHTML=`
    <div class="metric"><div class="metric-label">銷項發票合計</div><div class="metric-value green">$${fmt(totalSales)}</div></div>
    <div class="metric"><div class="metric-label">進項發票合計</div><div class="metric-value red">$${fmt(totalPurch)}</div></div>
    <div class="metric"><div class="metric-label">發票差額</div><div class="metric-value ${diff>=0?'green':'red'}">${diff>=0?'+':''}$${fmt(diff)}</div></div>
    <div class="metric"><div class="metric-label">當月淨利潤</div><div class="metric-value ${profit>=0?'green':'red'}">${profit>=0?'+':''}$${fmt(profit)}</div></div>`;

  document.getElementById('purch-inv-list').innerHTML=purchInvs.length?purchInvs.map(i=>`
    <div class="list-item" onclick="openAction('purchInvs','${i.id}')">
      <div class="item-icon icon-red">🧾</div>
      <div class="item-body">
        <div class="item-title">${i.vendor||'廠商'}　${i.desc||''}</div>
        <div class="item-sub">${i.date}</div>
      </div>
      <div class="item-right"><div class="item-amount red">$${fmt(i.amount)}</div></div>
    </div>`).join(''):'<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">尚無進項發票</div></div>';

  document.getElementById('sales-inv-list').innerHTML=salesInvs.length?salesInvs.map(i=>`
    <div class="list-item" onclick="openAction('salesInvs','${i.id}')">
      <div class="item-icon icon-green">🧾</div>
      <div class="item-body">
        <div class="item-title">${i.owner||'業主'}　${i.desc||''}</div>
        <div class="item-sub">${i.date}</div>
      </div>
      <div class="item-right"><div class="item-amount green">$${fmt(i.amount)}</div></div>
    </div>`).join(''):'<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">尚無銷項發票</div></div>';

  document.getElementById('inv-breakdown').innerHTML=`
    <div class="f-row"><span class="f-label">銷項發票（開給業主）</span><span style="color:var(--green-d)">$${fmt(totalSales)}</span></div>
    <div class="f-row"><span class="f-label">進項發票（廠商給我）</span><span style="color:var(--red)">$${fmt(totalPurch)}</span></div>
    <div class="f-row total"><span>發票差額（銷項－進項）</span>
      <span style="font-size:22px;font-weight:800;color:${diff>=0?'var(--green-d)':'var(--red)'}">
        ${diff>=0?'+':''}$${fmt(diff)}
      </span>
    </div>
    <div style="margin-top:8px;padding:12px 14px;border-radius:10px;background:${diff<0?'var(--red-l)':'var(--green-l)'}">
      <div style="font-size:14px;font-weight:700;color:${diff<0?'var(--red)':'var(--green-d)'}">
        ${diff<0?'⚠️ 需補開進項發票 <span style="font-size:18px">$'+fmt(Math.abs(diff))+'</span>':'✅ 銷項充足，無需補開'}
      </div>
      <div style="font-size:11px;color:var(--gray);margin-top:4px">
        ${diff<0?'進項發票不足，尚差 $'+fmt(Math.abs(diff))+'，請補開發票':'當月發票差額正常'}
      </div>
    </div>`;

  document.getElementById('profit-block').innerHTML=`
    <div class="f-row"><span class="f-label">銷項發票（業主收款）</span><span style="color:var(--green-d)">$${fmt(totalSales)}</span></div>
    <div class="f-row"><span class="f-label">進項發票（廠商支出）</span><span style="color:var(--red)">－$${fmt(totalPurch)}</span></div>
    <div class="f-row"><span class="f-label">員工薪資支出</span><span style="color:var(--red)">－$${fmt(totalSalary)}</span></div>
    <div class="f-row total" style="padding-top:12px">
      <span>💹 當月淨利潤</span>
      <span style="font-size:24px;font-weight:800;color:${profit>=0?'var(--green-d)':'var(--red)'}">

  toast('✅ Email 已儲存');
}

function exportExcel(){
  if(typeof XLSX==='undefined'){alert('套件載入中');return}
  const wb=XLSX.utils.book_new();
  const e=getM('employees'),v=getM('vendors'),o=getM('owners'),pi=getM('purchInvs'),si=getM('salesInvs'),j=getM('journals');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['日期','員工','出勤','天數','薪資','預支','已匯款','備註'],...e.map(x=>[x.date,x.name,x.attend,x.days,x.earning,x.advance,x.paid?'是':'否',x.remark])]),'員工薪資');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['日期','施工內容','備註'],...j.map(x=>[x.date,x.content,x.remark])]),'工作日誌');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['日期','大項','說明','金額','備註'],...v.map(x=>[x.date,x.cat||'',x.desc,x.amount,x.remark])]),'支出項目');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['業主','施工內容','收費'],...o.map(x=>[x.owner,x.desc,x.amount])]),'業主施工');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['日期','廠商','說明','金額'],...pi.map(x=>[x.date,x.vendor,x.desc,x.amount])]),'進項發票');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['日期','業主','說明','金額'],...si.map(x=>[x.date,x.owner,x.desc,x.amount])]),'銷項發票');
  XLSX.writeFile(wb,'空調工程_'+currentMonth+'.xlsx');
  toast('📊 Excel 已匯出');
}

function exportYear(){
  if(typeof XLSX==='undefined'){alert('套件載入中');return}
  const year=currentMonth.slice(0,4);
  const months=Array.from({length:12},(_,i)=>year+'-'+String(i+1).padStart(2,'0'));
  const wb=XLSX.utils.book_new();

  // 年度總覽（含淨利潤）
  const sum=[['月份','銷項發票','進項發票','發票差額','員工薪資','當月淨利潤']];
  months.forEach(m=>{
    const md=cache.months[m]||{};
    const sales=(md.salesInvs||[]).reduce((s,i)=>s+Number(i.amount||0),0);
    const purch=(md.purchInvs||[]).reduce((s,i)=>s+Number(i.amount||0),0);
    const isWork=e=>['出勤','加班'].includes(e.attend);
    const salary=(md.employees||[]).reduce((s,e)=>s+(isWork(e)?Number(e.earning||0):0),0);
    const profit=sales-purch-salary;
    sum.push([m,sales,purch,sales-purch,salary,profit]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),year+'年度總覽');

  // 各月資料
  const allE=[['月份','日期','員工','出勤','天數','薪資','預支']];
  const allJ=[['月份','日期','施工內容']];
  const allV=[['月份','日期','大項','說明','金額','備註']];
  const allO=[['月份','業主','施工內容','收費']];
  const allPI=[['月份','日期','廠商','說明','金額']];
  const allSI=[['月份','日期','業主','說明','金額']];
  months.forEach(m=>{
    const md=cache.months[m]||{};
    (md.employees||[]).forEach(e=>allE.push([m,e.date,e.name,e.attend,e.days,e.earning,e.advance]));
    (md.journals||[]).forEach(j=>allJ.push([m,j.date,j.content]));
    (md.vendors||[]).forEach(v=>allV.push([m,v.date,v.cat||'',v.desc,v.amount,v.remark]));
    (md.owners||[]).forEach(o=>allO.push([m,o.owner,o.desc,o.amount]));
    (md.purchInvs||[]).forEach(i=>allPI.push([m,i.date,i.vendor,i.desc,i.amount]));
    (md.salesInvs||[]).forEach(i=>allSI.push([m,i.date,i.owner,i.desc,i.amount]));
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allE),'全年員工薪資');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allJ),'全年工作日誌');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allV),'全年支出項目');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allO),'全年業主施工');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allPI),'全年進項發票');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(allSI),'全年銷項發票');

  // 下載 Excel
  const fname='空調工程_'+year+'年度報表.xlsx';
  XLSX.writeFile(wb,fname);
  toast('📅 年度報表已匯出');

  // 寄送 Email（透過 Google Apps Script）
  const emails=JSON.parse(localStorage.getItem('reportEmails')||'[]').filter(Boolean);
  if(emails.length){
    // 轉成 base64 讓 GAS 寄送
    const wbout=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    const payload=encodeURIComponent(JSON.stringify({
      type:'sendEmail',
      emails,
      year,
      filename:fname,
      filedata:wbout
    }));
    fetch(API_URL+'?payload='+payload+'&cb='+Date.now(),{method:'GET',mode:'cors',credentials:'omit'})
      .then(r=>r.json())
      .then(r=>{
        if(r.success)toast('📧 年報已寄至 '+emails.join('、'));
        else toast('⚠️ 寄送失敗：'+r.error);
      })
      .catch(()=>toast('⚠️ 寄送失敗，請確認網路'));
  }
}
